!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos </title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f3ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        wa: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #f3e8ff 100%);
        }
        .title-underline::after {
            content: '';
            display: block;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #4f46e5 0%, #818cf8 100%);
            border-radius: 9999px;
            margin-top: 6px;
        }
        .input-focus-effect {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-focus-effect:focus {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl shadow-indigo-900/10 overflow-hidden border border-slate-100 transform transition-all">
        
        <!-- Header & Form Content -->
        <div class="p-6 sm:p-8 pb-4">
            <!-- Header Title -->
            <div class="mb-6">
                <div class="inline-block">
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight title-underline">
                        Contáctanos
                    </h1>
                </div>
                <p class="text-xs font-semibold text-indigo-600 tracking-wider uppercase mt-3">UTIM / UATV • Tulcingo de Valle</p>
            </div>

            <!-- Form -->
            <form id="contactForm" onsubmit="enviarWhatsApp(event)" class="space-y-4">
                
                <!-- Nombre Field -->
                <div>
                    <label for="nombre" class="block text-sm font-bold text-slate-800 mb-1.5">Nombre:</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        placeholder="Tu nombre completo" 
                        required
                        class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:bg-white input-focus-effect"
                    >
                </div>

                <!-- Teléfono Field -->
                <div>
                    <label for="telefono" class="block text-sm font-bold text-slate-800 mb-1.5">Teléfono:</label>
                    <input 
                        type="tel" 
                        id="telefono" 
                        placeholder="Tu número de teléfono" 
                        required
                        class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:bg-white input-focus-effect"
                    >
                </div>

                <!-- Correo Field -->
                <div>
                    <label for="correo" class="block text-sm font-bold text-slate-800 mb-1.5">Correo electrónico:</label>
                    <input 
                        type="email" 
                        id="correo" 
                        placeholder="tu.correo@ejemplo.com" 
                        required
                        class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:bg-white input-focus-effect"
                    >
                </div>

                <!-- Comentario Field -->
                <div>
                    <label for="comentario" class="block text-sm font-bold text-slate-800 mb-1.5">Comentario:</label>
                    <textarea 
                        id="comentario" 
                        placeholder="Escribe tu mensaje..." 
                        rows="3" 
                        required
                        class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:bg-white input-focus-effect resize-none"
                    ></textarea>
                </div>

                <!-- Captcha Box -->
                <div class="p-4 bg-indigo-50/70 border-2 border-dashed border-indigo-300 rounded-2xl my-2">
                    <div class="flex items-center justify-between mb-2">
                        <label id="captchaQuestion" class="text-sm font-extrabold text-indigo-950">
                            ¿Cuánto es 1 + 3?
                        </label>
                        <button type="button" onclick="generarCaptcha()" class="text-xs text-indigo-600 font-bold hover:text-indigo-800 underline">
                            Cambiar
                        </button>
                    </div>
                    <input 
                        type="number" 
                        id="captchaAnswer" 
                        placeholder="Escribe el resultado" 
                        required
                        class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full py-3.5 px-6 bg-gradient-to-r from-emerald-400 via-wa-500 to-wa-600 text-white font-bold text-base rounded-xl shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 hover:brightness-105 active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2"
                >
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                    </svg>
                    Enviar por WhatsApp
                </button>
            </form>
        </div>

        <!-- Interactive Map Section -->
        <div class="relative h-48 bg-slate-200 border-t border-slate-100 overflow-hidden">
            <a 
                href="https://maps.google.com/?q=Tulcingo+de+Valle,+Puebla" 
                target="_blank" 
                class="absolute top-3 left-3 z-10 bg-white/95 backdrop-blur-sm text-brand-700 hover:text-brand-600 px-3 py-1.5 rounded-lg text-xs font-bold shadow-md hover:shadow-lg border border-indigo-100 flex items-center gap-1.5 transition-all"
            >
                Abrir en Maps
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
            </a>
            
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15157.157416757!2d-98.4485!3d17.9628!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85c5e03260be55bb%3A0xcf95a4918e95bf0a!2sTulcingo%20de%20Valle%2C%20Pue.!5e0!3m2!1ses!2smx!4v1700000000000!5m2!1ses!2smx" 
                class="w-full h-full border-0 grayscale-[0.2] hover:grayscale-0 transition-all duration-300"
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>

    </div>

    <script>
        let num1 = 1;
        let num2 = 3;
        let respuestaCorrecta = 4;

        function generarCaptcha() {
            num1 = Math.floor(Math.random() * 9) + 1;
            num2 = Math.floor(Math.random() * 9) + 1;
            respuestaCorrecta = num1 + num2;
            document.getElementById('captchaQuestion').innerText = `¿Cuánto es ${num1} + ${num2}?`;
        }

        function enviarWhatsApp(event) {
            event.preventDefault();

            const respuestaUsuario = parseInt(document.getElementById('captchaAnswer').value.trim());

            if (respuestaUsuario !== respuestaCorrecta) {
                alert('La respuesta del CAPTCHA es incorrecta. Inténtalo de nuevo.');
                generarCaptcha();
                document.getElementById('captchaAnswer').value = '';
                return;
            }

            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const comentario = document.getElementById('comentario').value.trim();

            const mensaje = `*Nuevo Formulario de Contacto (UTIM/UATV)*%0A%0A` +
                            `👤 *Nombre:* ${encodeURIComponent(nombre)}%0A` +
                            `📞 *Teléfono:* ${encodeURIComponent(telefono)}%0A` +
                            `✉️ *Correo:* ${encodeURIComponent(correo)}%0A` +
                            `💬 *Comentario:* ${encodeURIComponent(comentario)}%0A%0A` +
                            `📍 _Tulcingo de Valle, Puebla_`;

            
            const urlWhatsApp = `https://wa.me/?text=${mensaje}`;

            window.open(urlWhatsApp, '_blank');
        }

        window.onload = generarCaptcha;
    </script>

</body>
</html>
