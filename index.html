<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hola Mundo</title>
  <style>
    /* Estilos para centrar todo en la pantalla */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <h1 id="mensaje"></h1>

  <script>
    // Tu función con return
    function saludar() {
      return "Hola mundo";
    }

    // Insertamos el resultado en el elemento centrado
    document.getElementById("mensaje").textContent = saludar();
  </script>

</body>
</html>
